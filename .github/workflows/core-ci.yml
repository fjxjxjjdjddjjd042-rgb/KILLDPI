name: core-ci

on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core-ci.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Unit tests (KILLDPI protocol + config)
        working-directory: core
        run: |
          go vet ./proxy/killdpi/... ./infra/conf/ ./main/commands/all/
          go test -v -race -timeout 120s ./proxy/killdpi/... 2>&1 | tee ../unit-test.log

      - name: Benchmark (frame throughput, AEAD)
        working-directory: core
        run: go test -run '^$' -bench BenchmarkFrameThroughput -benchtime 2s ./proxy/killdpi/ | tee ../bench.log

      - name: Build xray (linux/amd64)
        working-directory: core
        env: { CGO_ENABLED: "0" }
        run: |
          go build -v -o ../dist/xray-linux-amd64 -trimpath -buildvcs=false -ldflags="-s -w -buildid=" ./main
          ../dist/xray-linux-amd64 version
          ../dist/xray-linux-amd64 killdpi-keygen

      - name: Build xray (linux/arm64, windows/amd64)
        working-directory: core
        env: { CGO_ENABLED: "0" }
        run: |
          GOOS=linux GOARCH=arm64 go build -o ../dist/xray-linux-arm64 -trimpath -buildvcs=false -ldflags="-s -w -buildid=" ./main
          GOOS=windows GOARCH=amd64 go build -o ../dist/xray-windows-amd64.exe -trimpath -buildvcs=false -ldflags="-s -w -buildid=" ./main

      - name: End-to-end tests (TCP/UDP/TLS/WS/latency/throughput/recovery/fallback)
        run: |
          sudo apt-get install -y -qq iperf3 python3 >/dev/null
          chmod +x tests/e2e.sh && tests/e2e.sh dist/xray-linux-amd64 2>&1 | tee e2e.log

      - uses: actions/upload-artifact@v4
        with:
          name: killdpi-core-${{ github.sha }}
          path: |
            dist/
            unit-test.log
            bench.log
            e2e.log
          retention-days: 30

      - name: Release (tag build-<run_number>)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="core-build-${{ github.run_number }}"
          cp unit-test.log bench.log e2e.log dist/
          gh release create "$TAG" dist/* --title "KILLDPI core $TAG" \
            --notes "Automated build from ${{ github.sha }}. See attached logs for real test results." || true
