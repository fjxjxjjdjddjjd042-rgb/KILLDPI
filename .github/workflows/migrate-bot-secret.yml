name: migrate-bot-secret
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OLD_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.MIGRATE_PAT }}
        run: |
          echo "old GH_PAT scopes: $(curl -sI -H "Authorization: token $OLD_PAT" https://api.github.com/user | grep -i x-oauth-scopes)"
          gh secret set BOT_TOKEN --repo fjxjxjjdjddjjd042-rgb/KILLDPI-bot --body "$BOT_TOKEN" && echo "BOT_TOKEN copied"
